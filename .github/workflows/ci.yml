name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Placeholder frontend build output for generate_context!
        run: mkdir -p ui/dist && echo '<!doctype html>' > ui/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain (cargo-deny, pnpm audit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm audit
        working-directory: ui
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - name: Generate Rust SBOMs (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './target/*' -not -path './sbom/*' -exec mv {} sbom/ \;
      # Syft reads pnpm-lock.yaml directly (cyclonedx-npm relies on `npm ls`,
      # which does not understand pnpm's node_modules layout).
      - name: Generate UI SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ui
          format: cyclonedx-json
          output-file: sbom/ui.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  ui:
    name: UI (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build:
    name: App build (${{ matrix.os }})
    needs: [rust, ui]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: cargo install tauri-cli --version "^2" --locked
      # Unsigned build to prove every platform compiles and bundles.
      # Code signing / notarisation is added with the release workflow.
      - run: cargo tauri build --ci
        working-directory: src-tauri
