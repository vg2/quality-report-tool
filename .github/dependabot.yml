version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
    groups:
      rust-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly }
    # Matches minimumReleaseAge in ui/pnpm-workspace.yaml.
    cooldown: { default-days: 3 }
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # Held on TypeScript 5.x until typescript-eslint supports the Go-based
      # TypeScript 7 compiler; revisit deliberately rather than via Dependabot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
