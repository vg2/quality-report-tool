# Supply-chain policy, enforced in CI by `cargo deny check`.

[graph]
all-features = false

[advisories]
# Known vulnerabilities fail the build; yanked crates warn.
yanked = "warn"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

# SQLCipher bundles SQLite (public-domain "blessing") and libtomcrypt
# (WTFPL / public domain). Both are permissive; allowed for this crate only.
exceptions = [
    { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

[licenses.private]
# Our own unpublished crates are not license-checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
